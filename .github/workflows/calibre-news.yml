name: Calibre News Delivery

on:
  workflow_dispatch:
    inputs:
      format:
        description: '输出格式（Kindle 原生只认 azw3 / mobi / pdf / txt）'
        required: false
        default: 'azw3'
  schedule:
    # 北京时间每天早上 6:00 = UTC 前一天 22:00
    - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    env:
      output: converted_ebooks
      publisher: kindle-news
      author: Calibre News Delivery
      ext: ${{ github.event.inputs.format || 'azw3' }}
      size: 25
      relay: ${{ secrets.SMTP }}
      port: ${{ secrets.PORT }}
      encrypt: ${{ secrets.ENCRYPT }}
      secret: ${{ secrets.SECRET }}
      from: ${{ secrets.FROM }}
      to: ${{ secrets.TO }}
    steps:
      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
          wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin

      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Recipes
        run: |
          : > temp_recipe_list.txt
          if [ -f recipe_list.txt ]; then
            while read -r r || [ -n "$r" ]; do
              [ -z "$r" ] && continue
              case "$r" in \#*) continue ;; esac
              title="${r%.recipe}"
              # --list-recipes 输出可能带前导空格，做去空白后的不区分大小写匹配
              flat=$(printf '%s' "$title" | tr -d '[:space:]' | tr 'A-Z' 'a-z')
              if ebook-convert --list-recipes 2>/dev/null |
                   tr -d '[:space:]' | tr 'A-Z' 'a-z' | grep -qF "$flat"; then
                [ "${r##*.}" = "recipe" ] || r="$r.recipe"
                echo "$r" >> temp_recipe_list.txt
              else
                echo "Skip (not a built-in recipe): $r"
              fi
            done < recipe_list.txt
          fi
          find . -maxdepth 1 -type f -name '*.recipe' >> temp_recipe_list.txt
          sort -u temp_recipe_list.txt -o temp_recipe_list.txt
          echo "Recipe count: $(wc -l < temp_recipe_list.txt)"
          if [ ! -s temp_recipe_list.txt ]; then
            echo 'No recipe needs processing'; exit 1
          fi

      - name: Converting Ebook
        run: |
          mkdir -p "$output"
          while read -r recipe_path || [ -n "$recipe_path" ]; do
            ebook_name="$(basename "${recipe_path%.*}")"
            ebook_path="$ebook_name.${ext,,}"
            echo "Converting \"$recipe_path\" > \"$ebook_path\" ..."
            args=(--authors="$author" --publisher="$publisher")
            [ -f "covers/$ebook_name.png" ] && args+=(--cover="covers/$ebook_name.png")
            [ -f "styles/$ebook_name.css" ] && args+=(--extra-css="styles/$ebook_name.css")
            if ebook-convert "$recipe_path" "$ebook_path" "${args[@]}"; then
              title=$(ebook-meta "$ebook_path" 2>/dev/null | sed -n 's/^Title *: *\(.*\)$/\1/p' | head -1)
              [ -n "$title" ] || title="$ebook_name"
              title=$(echo "$title" | tr -d '/\\:')
              mv -f "$ebook_path" "$output/${title}.${ext,,}"
              echo "OK: $title"
              # 邮件通道只收 epub/pdf/doc/txt/mobi 等需转换格式，
              # azw3/kfx 这类 Kindle 原生格式会被亚马逊静默丢弃。
              # 因此额外生成一份 epub 专供邮件推送（服务端自动转 azw3/kfx 下发）。
              if [ "${ext,,}" != "epub" ]; then
                echo "Converting \"$recipe_path\" > \"${title}.epub\" (for email) ..."
                if ebook-convert "$recipe_path" "$output/${title}.epub" "${args[@]}"; then
                  echo "OK(epub): $title"
                else
                  echo "FAILED(epub): $recipe_path"
                fi
              fi
            else
              echo "FAILED: $recipe_path"
            fi
          done < temp_recipe_list.txt
          count=$(find "$output" -type f -name "*.${ext,,}" | wc -l)
          echo "Ebook count: $count"
          if [ "$count" -eq 0 ]; then
            echo 'No ebook was produced'; exit 1
          fi

      - name: Build Index
        run: python3 scripts/make_index.py

      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$output"
          git init -q .
          git checkout -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update ebooks $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 1
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages"

      - name: Send to Kindle via Email
        # 可选：在仓库 Settings → Secrets 里填 FROM/TO/SMTP/PORT/ENCRYPT/SECRET 才启用
        # 美区(@kindle.com)账号的 Send to Kindle 邮件通道仍可用；FROM 必须是亚马逊后台「批准的电邮列表」里的完整邮箱
        if: ${{ env.from != '' && env.to != '' && env.relay != '' && env.port != '' }}
        run: |
          if [ -z "$secret" ]; then echo "SECRET 未设置，跳过邮件发送"; exit 0; fi
          cd "$output"
          # 邮件通道只支持 epub/pdf/doc/txt/mobi 等需转换格式，不支持 azw3/kfx。
          # 必须发 epub，亚马逊服务端会自动转成 azw3/kfx 再下发到设备。
          shopt -s nullglob
          files=(*.epub)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有可用于邮件的 epub 文件，跳过"; exit 0
          fi
          for f in "${files[@]}"; do
            base="$(basename "${f%.*}")"
            echo "Sending \"$base\" (epub) -> $to ..."
            if calibre-smtp \
                 --username "$from" \
                 --password "$secret" \
                 --relay "$relay" \
                 --port "$port" \
                 ${encrypt:+--encryption "${encrypt^^}"} \
                 --subject "$base" \
                 --attachment "$PWD/$f" \
                 "$from" "$to" "$base"; then
              echo "Sent: $base"
            else
              echo "FAILED: $base"
            fi
          done
          echo "Email delivery done."

      - name: Storing Ebook
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: kindle-news
          path: ${{ env.output }}
          retention-days: 30
