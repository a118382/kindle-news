name: Debug Feed

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl n8n webhook from GitHub runner
        run: |
          echo "=== HEAD ==="
          curl -sI --max-time 60 "https://n8n.nbhub.xyz/webhook/jin10" | head -12
          echo "=== BODY ==="
          curl -sL --max-time 60 "https://n8n.nbhub.xyz/webhook/jin10" -o /tmp/f.xml -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          head -c 700 /tmp/f.xml
          echo
          echo "=== counts ==="
          grep -c "<item>" /tmp/f.xml || echo "no item"
          echo "=== python parse ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              t = ET.parse('/tmp/f.xml')
              items = t.getroot().findall('.//item')
              print("XML OK, items:", len(items))
              for it in items[:3]:
                  print("  title:", (it.findtext('title') or '')[:50])
                  print("  pubDate:", it.findtext('pubDate'))
          except Exception as e:
              print("XML PARSE ERROR:", e)
          PY
